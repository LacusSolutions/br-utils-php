name: Lint Source Code

on:
  workflow_call:
    inputs:
      packages:
        type: string
        description: 'JSON array of package names to lint (e.g. ["br-utils","cpf-val"])'
        required: true
      php-versions:
        type: string
        description: 'JSON array of PHP versions (e.g. ["8.2","8.3","8.4","8.5"])'
        required: true
      max-parallel:
        type: number
        description: 'Maximum number of parallel jobs'
        required: false
        default: 4

permissions:
  contents: read

jobs:
  lint:
    name: Lint `lacus/${{ matrix.package }}` in PHP v${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        php-version: ${{ fromJSON(inputs.php-versions) }}
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, intl, libxml, mbstring
          coverage: xdebug
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-php-lint-${{ matrix.package }}-${{ hashFiles('composer.lock', format('packages/{0}/composer.lock', matrix.package)) }}
          path: |
            vendor/
            packages/${{ matrix.package }}/vendor/

      - run: composer validate --strict
        working-directory: .
      - run: composer install --no-interaction --no-progress --optimize-autoloader --prefer-dist
        working-directory: .

      - run: composer validate --strict
        working-directory: packages/${{ matrix.package }}
      - run: composer install --no-interaction --no-progress --optimize-autoloader --prefer-dist
        working-directory: packages/${{ matrix.package }}

      - run: composer run lint:ci
        working-directory: packages/${{ matrix.package }}
